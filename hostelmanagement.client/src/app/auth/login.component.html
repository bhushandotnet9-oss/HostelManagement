<div class="container d-flex justify-content-center py-5">
  <div class="card" style="max-width: 400px; width: 100%;">
    <div class="card-body">
      <h1 class="card-title h4 mb-3">Owner Login</h1>
      <form (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label" for="login-email">Email</label>
          <input type="email" id="login-email" class="form-control" name="email" [(ngModel)]="email" required />
        </div>
        <div class="mb-3">
          <label class="form-label" for="login-password">Password</label>
          <input
            type="password"
            id="login-password"
            class="form-control"
            name="password"
            [(ngModel)]="password"
            required
          />
        </div>
        <button type="submit" class="btn btn-primary w-100">Log in</button>
      </form>
      <p class="mt-3 mb-0"><a routerLink="/setup">New owner? Set up your org</a></p>
    </div>
  </div>
</div>
