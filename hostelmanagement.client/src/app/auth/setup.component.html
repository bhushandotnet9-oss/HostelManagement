<div class="container d-flex justify-content-center py-5">
  <div class="card" style="max-width: 400px; width: 100%;">
    <div class="card-body">
      <h1 class="card-title h4 mb-3">Set Up Your Hostel Org</h1>
      <form (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label" for="setup-org-name">Organization Name</label>
          <input type="text" id="setup-org-name" class="form-control" name="orgName" [(ngModel)]="orgName" required />
        </div>
        <div class="mb-3">
          <label class="form-label" for="setup-email">Email</label>
          <input type="email" id="setup-email" class="form-control" name="email" [(ngModel)]="email" required />
        </div>
        <div class="mb-3">
          <label class="form-label" for="setup-password">Password</label>
          <input
            type="password"
            id="setup-password"
            class="form-control"
            name="password"
            [(ngModel)]="password"
            required
          />
        </div>
        <button type="submit" class="btn btn-primary w-100">Create account</button>
      </form>
      <p class="mt-3 mb-0"><a routerLink="/login">Already have an account? Log in</a></p>
    </div>
  </div>
</div>
