<div class="container py-4">
  <h1 class="mb-4">Expenses</h1>

  <ul class="list-group mb-4">
    @for (hostel of hostels(); track hostel.id) {
      <li class="list-group-item">
        <button type="button" class="btn btn-link p-0" (click)="selectHostel(hostel)">{{ hostel.name }}</button>
      </li>
    }
  </ul>

  @if (selectedHostel()) {
    <div>
      <h2 class="h5 mb-3">{{ selectedHostel()!.name }}</h2>

      <div class="card mb-4">
        <div class="card-body">
          <h3 class="card-title h6">Add expense</h3>
          <form (ngSubmit)="createExpense()" class="row g-2 align-items-end">
            <div class="col-auto">
              <label class="form-label" for="new-expense-category">Category</label>
              <select
                id="new-expense-category"
                class="form-select"
                name="newCategory"
                [(ngModel)]="newCategory"
                required
              >
                <option value="Electricity">Electricity</option>
                <option value="Wifi">Wifi</option>
                <option value="Maintenance">Maintenance</option>
                <option value="Staff">Staff</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="col-auto">
              <label class="form-label" for="new-expense-amount">Amount</label>
              <input
                type="number"
                id="new-expense-amount"
                class="form-control"
                name="newAmount"
                [(ngModel)]="newAmount"
                required
              />
            </div>
            <div class="col-auto">
              <label class="form-label" for="new-expense-date">Date</label>
              <input type="date" id="new-expense-date" class="form-control" name="newDate" [(ngModel)]="newDate" required />
            </div>
            <div class="col-auto">
              <label class="form-label" for="new-expense-notes">Notes</label>
              <input type="text" id="new-expense-notes" class="form-control" name="newNotes" [(ngModel)]="newNotes" />
            </div>
            <div class="col-auto">
              <button type="submit" class="btn btn-primary">Add expense</button>
            </div>
          </form>
        </div>
      </div>

      <div class="card mb-4">
        <div class="card-body">
          <h3 class="card-title h6">Category breakdown</h3>
          <form (ngSubmit)="loadBreakdown()" class="row g-2 align-items-end mb-3">
            <div class="col-auto">
              <label class="form-label" for="range-from">From</label>
              <input type="date" id="range-from" class="form-control" name="rangeFrom" [(ngModel)]="rangeFrom" required />
            </div>
            <div class="col-auto">
              <label class="form-label" for="range-to">To</label>
              <input type="date" id="range-to" class="form-control" name="rangeTo" [(ngModel)]="rangeTo" required />
            </div>
            <div class="col-auto">
              <button type="submit" class="btn btn-primary">View breakdown</button>
            </div>
          </form>

          <table class="table table-striped table-hover">
            <thead>
              <tr>
                <th>Category</th>
                <th>Total</th>
              </tr>
            </thead>
            <tbody>
              @for (entry of breakdown(); track entry.category) {
                <tr>
                  <td>{{ entry.category }}</td>
                  <td>{{ entry.total }}</td>
                </tr>
              }
            </tbody>
          </table>
        </div>
      </div>
    </div>
  }
</div>
